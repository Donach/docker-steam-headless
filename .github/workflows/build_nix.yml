name: Build Image (NixOS)

# Builds both image flavours on a self-hosted NixOS runner using the toolchain
# pinned by ./flake.nix, then publishes each image as a Forgejo *generic package*
# (a gzipped `docker save` tarball). The container registry is not used because
# this Forgejo instance is served under the /donach subpath, which the Docker
# registry protocol cannot address; the generic-package API works fine there.
#
# Pull on the target host (e.g. Unraid):
#   curl -fSL -H "Authorization: token <TOKEN>" \
#     https://git.bitp.cz/donach/api/v1/packages/donach/generic/steam-headless/amd-fix/steam-headless-debian.tar.gz \
#     | gunzip | docker load

on:
  workflow_dispatch:
  push:
    branches: ['amd-gpu-support', 'master']

permissions:
  contents: read
  packages: write

env:
  # Enable flakes regardless of the runner's nix.conf (avoids quoting a CLI flag).
  NIX_CONFIG: "experimental-features = nix-command flakes"
  # Forgejo is served under this subpath; HTTP repo + API base must include it.
  FORGEJO_BASE: https://git.bitp.cz/donach
  PKG_OWNER: donach
  PKG_NAME: steam-headless
  PKG_VERSION: amd-fix

jobs:
  build-nix-debian:
    name: Build debian image (NixOS)
    runs-on: nix-shell-glcom
    env:
      FLAVOUR: debian
      IMAGE: steam-headless
      TAG: amd-fix-debian
      PLATFORM: linux/amd64
    steps:
      - name: Checkout (manual; instance served under /donach subpath)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="${GITHUB_SERVER_URL}"
          case "${base}" in *git.bitp.cz*) base="${FORGEJO_BASE}" ;; esac
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@${base#https://}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Show pinned build environment (also verifies docker.sock access)
        run: nix develop --command bash -c 'docker --version; docker info --format "daemon {{.ServerVersion}}"'

      - name: Build image (loads steam-headless:amd-fix-debian into local docker)
        run: nix run .#build-debian

      - name: Publish image tarball as a Forgejo generic package
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: nix run .#publish

  build-nix-arch:
    name: Build arch image (NixOS)
    runs-on: nix-shell-glcom
    env:
      FLAVOUR: arch
      IMAGE: steam-headless
      TAG: amd-fix-arch
      PLATFORM: linux/amd64
    steps:
      - name: Checkout (manual; instance served under /donach subpath)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="${GITHUB_SERVER_URL}"
          case "${base}" in *git.bitp.cz*) base="${FORGEJO_BASE}" ;; esac
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@${base#https://}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Build image (loads steam-headless:amd-fix-arch into local docker)
        run: nix run .#build-arch

      - name: Publish image tarball as a Forgejo generic package
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: nix run .#publish
